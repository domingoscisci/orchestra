specification: Agent Team Invariants
version: '1.0'
sections:
  structural:
  - id: INV-S01
    name: Single root
    rule: Each run MUST have exactly one Team Lead. The Team Lead's embedded
      session MUST NOT have a parent; every other member MUST have exactly one
      existing parent within that run.
    check: '`count(roots(run)) == 1` and
      `root.id == teamRun.leadMemberId` and
      `member(teamRun.leadMemberId).session.parentSessionId == null`.'
    violation: Reject invalid team onboarding or run update.
  - id: INV-S02
    name: Acyclic member hierarchy
    rule: The parent-child hierarchy MUST be acyclic, and every member MUST be
      connected to the Team Lead through its parent chain. A member MUST NOT be
      its own ancestor.
    check: Following parent links from any member terminates at the Team
      Lead without repeated IDs.
    violation: Reject the proposed change.
  - id: INV-S03
    name: One embedded session per member
    rule: Each member MUST contain exactly one embedded session object. Session
      IDs MUST be unique within the run.
    check: Every member has one `session` object and no two members share
      `session.id`.
    violation: Reject invalid onboarding data.
  - id: INV-S04
    name: Session and member hierarchy agree
    rule: A child member's `session.parentSessionId` MUST equal its parent
      member's `session.id`; the Team Lead's session MUST NOT have a parent
      session.
    check: '`member(m).session.parentSessionId ==
      member(parent(m)).session.id` for non-root members.'
    violation: Reject inconsistent onboarding data.
  - id: INV-S05
    name: Cross-run isolation
    rule: An entity MUST NOT reference a member, embedded session, domain,
      workstream, task, execution, or message from another run.
    check: Every referenced record belongs to the same `runId`; an embedded
      parent session ID resolves to a member in that run.
    violation: Reject the operation.
  - id: INV-S06
    name: Domain membership is exclusive
    rule: A member MUST belong to **at most one** domain in a run. The Domain
      Lead MUST be a member of the domain they lead, and every domain MUST have
      exactly one Domain Lead. A Domain Lead MUST NOT leave the domain or be
      removed while that domain exists.
    check: Each member appears in at most one domain's `memberIds`, and
      each domain's `leadMemberId` appears in that domain's `memberIds` and
      resolves to a member.
    violation: Reject conflicting membership or leadership assignments, and
      reject removing or moving a Domain Lead while their domain exists.
  - id: INV-S07
    name: Domains and workstreams are independent
    rule: Belonging to different domains MUST NOT, by itself, prevent members
      from working in the same workstream. A workstream MAY include tasks
      assigned to members from different domains.
    check: A workstream may contain tasks whose assignees belong to different
      domains; authorization does not reject that combination solely because of
      domain membership.
    violation: Reject a policy or operation that blocks workstream participation
      solely because of different domain membership.
  - id: INV-S08
    name: Single task assignee
    rule: A task MUST have at most one current assignee. An unassigned task is
      allowed. Reassignment MUST replace the assignee atomically rather than
      add another one.
    check: '`assigneeMemberId` is null or a single member ID in the run.'
    violation: Reject conflicting assignments.
  - id: INV-S09
    name: Single active execution per task and member
    rule: A task MUST NOT have more than one active execution at the same time.
      A member MUST NOT have more than one active execution at the same time.
    check: An execution is active when `status == "started"` and `endedAt` is
      absent. For each task and member, at most one execution may be active,
      enforced atomically.
    violation: Reject the second start attempt and report the conflict.
  - id: INV-S10
    name: Acyclic task dependencies
    rule: A task MUST NOT depend on itself, directly or indirectly. All
      dependency endpoints MUST resolve to tasks in the same run.
    check: The directed dependency graph is acyclic and contains no self-loops.
    violation: Reject the new dependency.
  - id: INV-S11
    name: Execution provenance
    rule: Every execution MUST reference exactly one existing task and one
      member in the same run. The member's embedded session is the session used
      for the execution.
    check: '`execution.memberId` resolves to a member with exactly one embedded
      session; the task and member share the execution''s `runId`.'
    violation: Reject the execution record.
  - id: INV-S12
    name: Immutable attempt history
    rule: A retry MUST create a **new** execution ID; prior execution records
      and their terminal results MUST remain available. An execution MUST NOT
      be overwritten to represent a new attempt.
    check: Distinct execution IDs; attempts for the same task are ordered by
      `startedAt`.
    violation: Reject overwrite/reuse; create a new record instead.
  - id: INV-S14
    name: Unique agent acronyms
    rule: Every member MUST have a non-empty acronym unique within the run and
      used as its short agent-facing reference. The acronym MUST remain stable
      for the run. During onboarding it SHOULD be generated from the member
      name's initials; collisions MUST be resolved with a numeric suffix.
    check: Every member has a unique acronym; no onboarding collision remains.
    violation: Reject onboarding until all acronyms are unique.
  behavioral_authorization:
  - id: INV-B01
    name: Fixed membership during a run
    rule: The complete team structure MUST be created during onboarding before
      the run starts. No one MAY change `teamRun.leadMemberId`, add or remove
      members, change member names,
      roles or acronyms, or change session IDs or parent-child relationships
      during the run. Session lifecycle status and `updatedAt` MAY change from
      OpenCode events.
    check: '`teamRun.leadMemberId`, member IDs, names, roles, acronyms, session
      IDs, and parent-session links remain unchanged after run creation;
      lifecycle status updates are allowed.'
    violation: Reject the team-structure change without altering the structure.
  - id: INV-B02
    name: Scoped task creation and assignment
    rule: The Team Lead MAY create tasks and assign them to any member in the
      run. A Domain Lead MAY create tasks and assign them only to members in its
      descendant subtree, regardless of the task's workstream.
      Other members MUST NOT create or assign tasks.
    check: The actor is the Team Lead or a Domain Lead; for a Domain Lead, every
      assignee is in `descendants(actor)`.
    violation: Deny without creating the task or changing its assignment.
  - id: INV-B03
    name: Hierarchical direct messaging
    rule: The Team Lead MAY send direct messages to any member in the run. Every
      other member MUST send direct messages only to its
      immediate parent or immediate children. Communication between branches
      MUST be relayed through the hierarchy.
    check: '`sender != recipient AND
      (sender == teamRun.leadMemberId OR parent(sender) == recipient OR
      parent(recipient) == sender)`.'
    violation: Refuse delivery.
  - id: INV-B04
    name: Do not bypass blocked dependencies
    rule: A task MUST NOT start an execution while any declared blocking task
      remains unresolved. A dependency is resolved only when the blocking task
      is `done` and its latest submitted execution report outcome is `completed`.
    check: '`all(blocker.status == "done" and
      blocker.report.outcome == "completed" for blocker in blockers(task))`
      immediately before start.'
    violation: Do not start; leave task pending or blocked and report blockers.
  - id: INV-B05
    name: Controlled execution start
    rule: An execution MAY start only when its task is assigned to the execution
      member, OpenCode accepts continuation of that member's existing session,
      dependencies are resolved, and no other active execution exists for that
      task or member. The stored session `status` alone does not determine
      usability. These conditions MUST be checked as one atomic admission
      decision where state can change concurrently.
    check: Assignee, OpenCode accepts `member(execution.memberId).session.id`,
      dependencies are ready, and there is no active execution for the task or
      member.
    violation: Reject start without partial state changes.
  - id: INV-B06
    name: Retry without identity loss
    rule: Resuming or retrying a task MUST preserve the original task ID and
      past execution records. If the same member continues, it MUST use that
      member's existing session. A reassignment MUST be explicit and authorized.
    check: New execution with same task ID and member ID; distinct execution
      ID. Its session is the member's embedded session.
    violation: Reject implicit replacement or silent reassignment.
  - id: INV-B07
    name: Review precedes acceptance
    rule: An execution's successful result MUST NOT automatically mark its task
      `done`. A task MAY be marked `done` only after explicit acceptance of its
      latest execution report with outcome `completed`. The Team Lead MAY accept
      any task; a Domain Lead MAY accept only tasks assigned to members in its
      descendant subtree.
    check: The transition from `review` to `done` is performed by the Team Lead
      or by a Domain Lead whose descendant subtree contains the task assignee,
      and the latest submitted execution report has outcome `completed`.
    violation: Reject unapproved completion.
  - id: INV-B08
    name: Report belongs to an execution
    rule: A report describing work performed MUST be attributable to a specific
      execution, with outcome, summary, and any test results or file changes. A
      task-level summary MAY be derived from execution reports but MUST NOT
      replace their provenance.
    check: Each persisted execution report is attached to its owning valid
      execution; a task-level report view is derived from an execution report.
    violation: Reject untraceable completion reports.
  - id: INV-B10
    name: Concurrency-safe updates
    rule: Mutations to any mutable record in a run MUST NOT silently overwrite a
      newer version. Updates MUST use an expected version or an equivalent
      atomic conflict-detection mechanism.
    check: The record's current version matches the expected version at write
      time.
    violation: Reject with a conflict; reload before retrying.
